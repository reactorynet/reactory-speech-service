name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app/ tests/

      - name: Test
        run: pytest -v -m "not slow"

  expressive-deps:
    name: speech-expressive requirements resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.13, not 3.11: chatterbox-tts caps numpy<2.0.0 below 3.13 while
      # kokoro-onnx requires numpy>=2.0.2, so the two are unsatisfiable together
      # on the speech-core interpreter. This must match Dockerfile.expressive.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # chatterbox-tts 0.1.7 pins torch==2.6.0 and torchaudio==2.6.0 exactly.
      # A pin that cannot resolve makes the speech-expressive image unbuildable,
      # and that failure is invisible to the default-image test suite. This step
      # resolves the whole graph without installing it.
      # Resolve both files together: Dockerfile.expressive installs them as one
      # resolution, so a conflict with numpy / transformers / librosa shows up
      # here rather than as a silent up/downgrade inside the image.
      - name: Resolve the expressive profile on top of speech-core
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt -r requirements-expressive.txt

      # Proves the CPU wheels are chosen: the plain manylinux torch wheel pulls
      # ~11 nvidia-*-cu12 packages into an image that must never need a GPU.
      - name: Assert the resolution is CPU-only
        run: |
          pip install --dry-run -r requirements.txt -r requirements-expressive.txt \
            2>&1 | tee /tmp/resolve.log
          if grep -q "^Would install.* nvidia-" /tmp/resolve.log; then
            echo "FAIL: CUDA packages resolved into the expressive profile"; exit 1
          fi
          grep -q "torch-2.6.0+cpu" /tmp/resolve.log

  image-size:
    name: speech-core image size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The ceiling is documented in docs/architecture/speech-platform.md and
      # enforced by the script; the step fails the build when it is exceeded.
      - name: Build the speech-core image
        run: docker build -t reactory-speech-service:speech-core .

      - name: Assert the documented edge budget
        run: ./scripts/check_image_size.sh --image reactory-speech-service:speech-core
