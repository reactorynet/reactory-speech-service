name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor; 3.14 is the speech-core image
        # interpreter (Dockerfile) and must stay here so a base-image bump is
        # tested, not only built (tests/test_image_budget.py asserts this).
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app/ tests/

      - name: Test
        run: pytest -v -m "not slow"

  # Both images must build on x86_64 (server deployment) and on aarch64 (Apple
  # Silicon podman/docker machines). The torch/torchaudio pins differ by
  # architecture (requirements-expressive.txt), so each one is resolved, built
  # and smoke-tested on a runner of that architecture.
  expressive-deps:
    name: speech-expressive requirements resolve (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # Only the +cpu build keeps CUDA out on x86_64.
            torch: torch-2.6.0+cpu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Either 2.6.0+cpu or plain 2.6.0: both are CPU-only on aarch64.
            torch: torch-2.6.0
    steps:
      - uses: actions/checkout@v7

      # 3.13 exactly: below 3.13 chatterbox-tts caps numpy<2.0.0 while
      # kokoro-onnx requires numpy>=2.0.2 (unsatisfiable together); from 3.14
      # chatterbox-tts wants torch>=2.9 instead of the measured 2.6.0+cpu pin.
      # This must match Dockerfile.expressive.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # chatterbox-tts 0.1.7 pins torch==2.6.0 and torchaudio==2.6.0 exactly.
      # A pin that cannot resolve makes the speech-expressive image unbuildable,
      # and that failure is invisible to the default-image test suite. This step
      # resolves the whole graph without installing it.
      # Resolve both files together: Dockerfile.expressive installs them as one
      # resolution, so a conflict with numpy / transformers / librosa shows up
      # here rather than as a silent up/downgrade inside the image.
      - name: Resolve the expressive profile on top of speech-core
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt -r requirements-expressive.txt

      # Proves the CPU wheels are chosen: the plain manylinux torch wheel pulls
      # ~11 nvidia-*-cu12 packages into an image that must never need a GPU.
      - name: Assert the resolution is CPU-only
        run: |
          pip install --dry-run -r requirements.txt -r requirements-expressive.txt \
            2>&1 | tee /tmp/resolve.log
          if grep -q "^Would install.* nvidia-" /tmp/resolve.log; then
            echo "FAIL: CUDA packages resolved into the expressive profile"; exit 1
          fi
          grep -q "${{ matrix.torch }}" /tmp/resolve.log

  expressive-image:
    name: speech-expressive image builds (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build the speech-expressive image
        run: docker build -f Dockerfile.expressive -t reactory-speech-service:speech-expressive .

      # Resolving is not installing: prove the wheels that landed import on this
      # architecture, and that the torch inside is a CPU-only build.
      - name: Smoke-test the engines inside the image
        run: |
          docker run --rm reactory-speech-service:speech-expressive python -c "
          import platform, torch, torchaudio, chatterbox.tts, kokoro_onnx, faster_whisper
          assert platform.machine() == '${{ matrix.arch }}', platform.machine()
          assert torch.version.cuda is None, torch.version.cuda
          print(platform.machine(), 'torch', torch.__version__, 'torchaudio', torchaudio.__version__)
          "

      # The multilingual adapter mirrors the installed package: its language
      # list, and the two upstream functions it replaces while loading so the
      # tokenizer never downloads anything. An upgrade that renames either
      # would otherwise only show up when the weights are first loaded.
      - name: Check the multilingual adapter against the installed package
        run: |
          docker run --rm reactory-speech-service:speech-expressive python -c "
          import chatterbox.mtl_tts as mtl, chatterbox.models.tokenizers.tokenizer as tok, spacy_pkuseg
          from app.engines.chatterbox import MULTILINGUAL_LANGUAGES
          assert set(mtl.SUPPORTED_LANGUAGES) == set(MULTILINGUAL_LANGUAGES), sorted(mtl.SUPPORTED_LANGUAGES)
          assert callable(tok.hf_hub_download) and callable(spacy_pkuseg.pkuseg)
          print('multilingual:', len(MULTILINGUAL_LANGUAGES), 'languages')
          "

  image-size:
    name: speech-core image size (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The ceiling is documented in docs/architecture/speech-platform.md and
      # enforced by the script; the step fails the build when it is exceeded.
      - name: Build the speech-core image
        run: docker build -t reactory-speech-service:speech-core .

      - name: Assert the documented edge budget
        run: ./scripts/check_image_size.sh --image reactory-speech-service:speech-core
