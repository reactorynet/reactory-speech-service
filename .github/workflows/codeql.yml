# Managed by reactory-workspace `seed` (policy: public-upstream).
# CodeQL is free on public repositories. Actions are pinned to commit SHAs.
#
# LOCAL OVERRIDE (reactory-speech-service): the seeded template hard-codes
# `javascript-typescript`, but this repository is a Python service with zero
# .js/.ts files. The extractor found nothing to analyse and the job failed with
# "Only found JavaScript or TypeScript files that were empty or contained syntax
# errors." -> "CodeQL job status was configuration error", which is a red check
# on every pull request that no change could ever turn green.
#
# `python` is the language this repository actually contains. `build-mode: none`
# is correct for an interpreted language: CodeQL extracts the source directly
# instead of running a build, so CI does not need espeak-ng, ffmpeg or the ~350MB
# model weight download that a real build would require.
name: CodeQL

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
