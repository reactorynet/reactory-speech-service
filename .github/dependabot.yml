# Managed by reactory-workspace `seed` (policy: public-upstream). Edits are
# overwritten on the next seed; change the template instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # github/codeql-action ships as three separate actions (init, analyze,
      # upload-sarif) that MUST all be the same version. CodeQL refuses to run
      # otherwise:
      #   "Loaded a configuration file for version '4.39.3', but running
      #    version '3.39.3'. All steps in a workflow that use
      #    github/codeql-action must use the same version"
      # Ungrouped, Dependabot opens one PR per action and every one of them
      # creates a version mismatch, so none of them can ever go green.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

